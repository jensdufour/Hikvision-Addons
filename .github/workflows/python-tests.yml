name: Offline tests and image checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
        working-directory: hikvision-doorbell
      - name: Offline tests
        run: pytest -q
        working-directory: hikvision-doorbell
      - name: Check Python errors
        run: flake8 src tests --select=E9,F63,F7,F82 --show-source
        working-directory: hikvision-doorbell
      - name: Build local image
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} -t hikvision-doorbell-lite:test hikvision-doorbell
      - name: Load SDK with no network
        run: >-
          docker run --rm --network none hikvision-doorbell-lite:test -c
          "from sdk.utils import loadSDK, setupSDK, shutdownSDK; sdk = loadSDK(); setupSDK(sdk); shutdownSDK(sdk)"