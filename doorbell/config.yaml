name: Hikvision Doorbell Lite
description: Ring and card events, call state, unlock and stop ringing for two Hikvision models
version: '0.1.4-dev'
slug: hikvision_doorbell_lite
url: https://github.com/jensdufour/Hikvision-Addons
arch:
  - amd64
  - aarch64
stage: experimental
startup: application
boot: manual
init: false
services:
  - mqtt:want
options:
  doorbells:
    - name: Front door
      model: DS-KV6113-WPE1(B)
      ip: ''
      username: admin
      password: ''
    - name: Indoor station
      model: DS-KH6320-WTE1
      ip: ''
      username: admin
      password: ''
  system:
    log_level: INFO
    poll_seconds: 5
  mqtt: {}
schema:
  doorbells:
    - name: str
      model: 'match(^(DS-KV6113-WPE1\(B\)|DS-KH6320-WTE1)$)'
      ip: str
      port: int(1,65535)?
      username: str
      password: password
  system:
    log_level: list(ERROR|WARNING|INFO|DEBUG)
    poll_seconds: int(2,60)
  mqtt:
    host: str?
    port: int(1,65535)?
    ssl: bool?
    username: str?
    password: password?